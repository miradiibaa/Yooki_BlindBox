<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Admin Dashboard - Yooki</title>
<link rel="stylesheet" href="assets/css/style.css">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
  body { background: #f8faff; }

  /* ADMIN LAYOUT */
  .admin-wrap { display: flex; min-height: 100vh; }

  /* SIDEBAR */
  .sidebar {
    width: 240px; background: #4d95ff; flex-shrink: 0;
    display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh;
  }
  .sidebar-logo { padding: 24px 20px 20px; border-bottom: 1px solid rgba(255,255,255,.08); }
  .sidebar-logo img { height: 40px; filter: brightness(0) invert(1); }
  .sidebar-nav { padding: 12px 0; flex: 1; }
  .sidebar-nav a {
    display: flex; align-items: center; gap: 12px;
    padding: 13px 20px; color: rgba(255,255,255,.7);
    text-decoration: none; font-weight: 700; font-size: 14px;
    transition: all .2s; border-left: 3px solid transparent;
  }
  .sidebar-nav a:hover, .sidebar-nav a.active {
    background: rgba(255,255,255,.2); color: #fff;
    border-left-color: #fff;
  }
  .sidebar-nav a i { width: 18px; text-align: center; }
  .sidebar-back {
    padding: 16px 20px; border-top: 1px solid rgba(255,255,255,.08);
  }
  .sidebar-back a {
    color: rgba(255,255,255,.4); font-size: 13px; font-weight: 700;
    text-decoration: none; display: flex; align-items: center; gap: 8px;
    transition: color .2s;
  }
  .sidebar-back a:hover { color: rgba(255,255,255,.8); }

  /* MAIN */
  .admin-main { flex: 1; padding: 32px; overflow-y: auto; }
  .admin-topbar {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 28px;
  }
  .admin-topbar h1 { font-size: 26px; font-weight: 900; }
  .admin-topbar .date-badge {
    background: white; border-radius: 10px; padding: 8px 16px;
    font-size: 13px; font-weight: 700; color: #888;
    box-shadow: 0 2px 8px rgba(0,0,0,.06);
  }

  /* STATS */
  .stats-row { display: grid; grid-template-columns: repeat(4,1fr); gap: 18px; margin-bottom: 24px; }
  .stat-card {
    background: white; border-radius: 18px; padding: 22px;
    box-shadow: 0 2px 12px rgba(0,0,0,.06);
  }
  .stat-icon {
    width: 44px; height: 44px; border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; margin-bottom: 12px;
  }
  .stat-val { font-size: 24px; font-weight: 900; margin-bottom: 3px; }
  .stat-lbl { font-size: 12px; color: #999; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; }
  .stat-change { font-size: 12px; font-weight: 700; margin-top: 6px; }
  .stat-change.up { color: #3a9a5a; }
  .stat-change.down { color: #c0536a; }

  /* PERIOD TOGGLE */
  .period-toggle { display: flex; gap: 8px; }
  .period-btn {
    background: #f0f0f0; border: none; padding: 8px 18px; border-radius: 20px;
    font-weight: 700; font-size: 13px; cursor: pointer;
    transition: all .2s; font-family: 'Nunito', sans-serif;
  }
  .period-btn.active { background: #F9C6CC; color: #c0536a; }

  /* CARDS */
  .grid-2 { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; margin-bottom: 20px; }
  .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 20px; margin-bottom: 20px; }
  .dash-card {
    background: white; border-radius: 18px; padding: 24px;
    box-shadow: 0 2px 12px rgba(0,0,0,.06);
  }
  .dash-card h3 { font-size: 16px; font-weight: 900; margin-bottom: 18px; display: flex; align-items: center; gap: 8px; }

  /* TABLE */
  .dash-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .dash-table th {
    background: #f8f8f8; padding: 10px 14px; text-align: left;
    font-weight: 800; font-size: 11px; color: #aaa; text-transform: uppercase; letter-spacing: .5px;
  }
  .dash-table td { padding: 11px 14px; border-bottom: 1px solid #f5f5f5; }
  .dash-table tr:last-child td { border-bottom: none; }
  .dash-table tr:hover td { background: #fafafa; }

  /* STATUS BADGES */
  .s-badge { padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 800; }
  .s-pending  { background: #FAF0A0; color: #7a7a10; }
  .s-paid     { background: #C1E0C8; color: #1a6a3a; }
  .s-shipped  { background: #B8DCF5; color: #1a5a8a; }
  .s-done     { background: #d4edda; color: #155724; }
  .s-cancelled{ background: #f8d7da; color: #721c24; }

  /* STATUS SELECT */
  .status-sel {
    border: 1px solid #e8e8e8; border-radius: 8px; padding: 4px 8px;
    font-family: 'Nunito', sans-serif; font-size: 12px; font-weight: 700;
    cursor: pointer; background: white;
  }

  /* TOP PRODUCT LIST */
  .top-prod-item {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 0; border-bottom: 1px solid #f5f5f5;
  }
  .top-prod-item:last-child { border: none; }
  .top-prod-rank {
    width: 26px; height: 26px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 900; flex-shrink: 0;
  }
  .rank-1 { background: #FAF0A0; color: #7a7a10; }
  .rank-2 { background: #f0f0f0; color: #666; }
  .rank-3 { background: #fde8d0; color: #a05020; }
  .rank-other { background: #f5f5f5; color: #aaa; }
  .top-prod-img { width: 40px; height: 40px; border-radius: 10px; object-fit: cover; flex-shrink: 0; }
  .top-prod-info { flex: 1; }
  .top-prod-name { font-size: 13px; font-weight: 800; }
  .top-prod-series { font-size: 11px; color: #aaa; }
  .top-prod-sold { font-size: 13px; font-weight: 900; color: #c0536a; }

  /* EMPTY */
  .empty-dash { text-align: center; padding: 40px 20px; color: #bbb; }
  .empty-dash .ei { font-size: 40px; margin-bottom: 10px; }
  .empty-dash p { font-size: 14px; font-weight: 700; }

  /* SEED BTN */
  .btn-seed {
    background: #F9C6CC; color: #c0536a; border: none;
    padding: 10px 20px; border-radius: 10px; font-weight: 800; font-size: 13px;
    cursor: pointer; font-family: 'Nunito', sans-serif; transition: all .2s;
  }
  .btn-seed:hover { background: #c0536a; color: white; }

  @media(max-width:768px){
    .admin-wrap { flex-direction: column; }
    .sidebar { width: 100%; height: auto; position: relative; }
    .sidebar-nav { display: flex; overflow-x: auto; padding: 8px 0; }
    .sidebar-nav a { padding: 10px 14px; border-left: none; border-bottom: 3px solid transparent; white-space: nowrap; }
    .sidebar-nav a.active, .sidebar-nav a:hover { border-left: none; border-bottom-color: #F9C6CC; }
    .stats-row { grid-template-columns: repeat(2,1fr); }
    .grid-2, .grid-3 { grid-template-columns: 1fr; }
    .admin-main { padding: 16px; }
  }
</style>
</head>
<body>

<div class="admin-wrap">
  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="sidebar-logo">
      <img src="assets/img/logo.png" alt="Yooki">
    </div>
    <nav class="sidebar-nav">
      <a href="#overview" class="active" onclick="showSection('overview',this)">
        <i class="fas fa-chart-line"></i> Overview
      </a>
      <a href="#orders" onclick="showSection('orders',this)">
        <i class="fas fa-box"></i> Orders
      </a>
      <a href="#products" onclick="showSection('products',this)">
        <i class="fas fa-tags"></i> Products
      </a>
    </nav>
    <div class="sidebar-back">
      <a href="my-orders.html" style="color:rgba(255,255,255,.4);font-size:13px;font-weight:700;text-decoration:none;display:flex;align-items:center;gap:8px;margin-bottom:10px;transition:color .2s;" onmouseover="this.style.color='rgba(255,255,255,.8)'" onmouseout="this.style.color='rgba(255,255,255,.4)'"><i class="fas fa-box"></i> My Orders</a><a href="index.html"><i class="fas fa-arrow-left"></i> Back to Store</a>
    </div>
  </aside>

  <!-- MAIN -->
  <main class="admin-main">
    <div class="admin-topbar">
     <h1 id="sectionTitle"><i class="fas fa-chart-line" style="color:#4d95ff;margin-right:8px;"></i>Overview</h1>
      <div class="date-badge" id="dateNow"></div>
    </div>

    <!-- ===== OVERVIEW ===== -->
    <div id="sec-overview">
      <!-- Stats -->
      <div class="stats-row" id="statsRow"></div>

      <!-- Chart + Top Products -->
      <div class="grid-2">
        <div class="dash-card">
          <h3 style="justify-content:space-between;">
            <span><i class="fas fa-chart-bar" style="color:#c0536a;margin-right:6px;"></i>Revenue</span>
            <div class="period-toggle">
              <button class="period-btn active" onclick="setPeriod('week',this)">7 Days</button>
              <button class="period-btn" onclick="setPeriod('month',this)">30 Days</button>
            </div>
          </h3>
          <canvas id="revenueChart" height="90"></canvas>
        </div>
        <div class="dash-card">
          <h3><i class="fas fa-trophy" style="color:#f0a800;margin-right:6px;"></i>Top Products</h3>
          <div id="topProducts"></div>
        </div>
      </div>

      <!-- Payment + City breakdown -->
      <div class="grid-3">
        <div class="dash-card">
          <h3><i class="fas fa-credit-card" style="color:#4d95ff;margin-right:6px;"></i>Payment Methods</h3>
          <canvas id="payChart" height="160"></canvas>
        </div>
        <div class="dash-card">
          <h3><i class="fas fa-map-marker-alt" style="color:#c0536a;margin-right:6px;"></i>Top Cities</h3>
          <div id="cityList"></div>
        </div>
        <div class="dash-card">
          h3><i class="fas fa-boxes" style="color:#7c5cbf;margin-right:6px;"></i>Order Status</h3>
          <canvas id="statusChart" height="160"></canvas>
        </div>
      </div>
    </div>

    <!-- ===== ORDERS ===== -->
    <div id="sec-orders" style="display:none">
      <div class="dash-card">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;flex-wrap:gap;">
          <div style="display:flex;gap:8px;flex-wrap:wrap;" id="orderFilterBtns">
            <button class="period-btn active" onclick="filterOrders('all',this)">All</button>
            <button class="period-btn" onclick="filterOrders('pending',this)">Pending</button>
            <button class="period-btn" onclick="filterOrders('paid',this)">Paid</button>
            <button class="period-btn" onclick="filterOrders('shipped',this)">Shipped</button>
            <button class="period-btn" onclick="filterOrders('done',this)">Done</button>
          </div>
          <button class="btn-seed" onclick="seedDemoOrders()">+ Add Demo Order</button>
        </div>
        <div style="overflow-x:auto;">
          <table class="dash-table" id="ordersTable">
            <thead>
              <tr>
                <th>Code</th><th>Customer</th><th>City</th>
                <th>Subtotal</th><th>Discount</th><th>Shipping</th><th>Total</th>
                <th>Payment</th><th>Status</th><th>Date</th>
              </tr>
            </thead>
            <tbody id="ordersBody"></tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- ===== PRODUCTS ===== -->
    <div id="sec-products" style="display:none">
      <div class="dash-card">
        <h3><i class="fas fa-tags" style="color:#4d95ff;margin-right:6px;"></i>Products List</h3>
        <div style="overflow-x:auto;">
          <table class="dash-table">
            <thead><tr><th>Image</th><th>Name</th><th>Series</th><th>Price</th><th>Stock</th><th>Status</th></tr></thead>
            <tbody id="productsBody"></tbody>
          </table>
        </div>
      </div>
    </div>

  </main>
</div>

<script src="assets/js/app.js"></script>
<script>
// ===== INIT =====
let currentPeriod = 'week';
let revenueChartInst, payChartInst, statusChartInst;

document.getElementById('dateNow').textContent = new Date().toLocaleDateString('en-US',{weekday:'long',year:'numeric',month:'long',day:'numeric'});

// ===== SECTION NAVIGATION =====
function showSection(name, el) {
  ['overview','orders','products'].forEach(s => {
    document.getElementById('sec-'+s).style.display = s===name ? '' : 'none';
  });
  document.querySelectorAll('.sidebar-nav a').forEach(a => a.classList.remove('active'));
  el.classList.add('active');
  const titles = {
  overview: '<i class="fas fa-chart-line" style="color:#4d95ff;margin-right:8px;"></i>Overview',
  orders:   '<i class="fas fa-box" style="color:#4d95ff;margin-right:8px;"></i>Orders',
  products: '<i class="fas fa-tags" style="color:#4d95ff;margin-right:8px;"></i>Products'
};
  document.getElementById('sectionTitle').innerHTML = titles[name];
  if(name==='orders') { fetchOrders().then(()=>renderOrdersTable('all')); }
  if(name==='products') renderProductsTable();
  return false;
}

// ===== GET ORDERS (from DB via API) =====
let _ordersCache = [];

async function fetchOrders() {
  try {
    const res = await fetch('api/get-orders.php');
    const data = await res.json();
    if(data.success) _ordersCache = data.orders;
  } catch(e) {
    console.warn('API error, fallback to localStorage', e);
    _ordersCache = JSON.parse(localStorage.getItem('yooki_orders') || '[]');
  }
  return _ordersCache;
}

function getOrders() {
  return _ordersCache;
}

async function updateStatusAPI(code, status) {
  try {
    const res = await fetch('api/update-status.php', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({code, status})
    });
    const data = await res.json();
    return data.success;
  } catch(e) {
    // fallback: update localStorage
    const orders = JSON.parse(localStorage.getItem('yooki_orders')||'[]');
    const o = orders.find(x=>x.code===code);
    if(o) { o.status=status; localStorage.setItem('yooki_orders',JSON.stringify(orders)); }
    return true;
  }
}

// ===== STATS =====
function calcStats() {
  const orders = getOrders();
  const paid = orders.filter(o => o.status !== 'cancelled');
  const revenue = paid.reduce((s,o) => s+o.total, 0);
  const avgOrder = paid.length ? revenue/paid.length : 0;
  const pending = orders.filter(o => o.status==='pending').length;

  // item sold
  let itemsSold = 0;
  paid.forEach(o => o.items.forEach(i => itemsSold += i.qty));

  return { revenue, totalOrders: orders.length, avgOrder, pending, itemsSold };
}

function renderStats() {
  const s = calcStats();
  document.getElementById('statsRow').innerHTML = `
    <div class="stat-card">
      <div class="stat-icon" style="background:#fff0f3;"><i class="fas fa-wallet" style="color:#c0536a;"></i></div>
      <div class="stat-val">${rp(s.revenue)}</div>
      <div class="stat-lbl">Total Revenue</div>
    </div>
    <div class="stat-card">
      <div class="stat-icon" style="background:#f0f4ff;"><i class="fas fa-box" style="color:#4d95ff;"></i></div>
      <div class="stat-val">${s.totalOrders}</div>
      <div class="stat-lbl">Total Orders</div>
    </div>
    <div class="stat-icon" style="background:#fff8e0;"><i class="fas fa-clock" style="color:#e0a000;"></i></div>
      <div class="stat-val">${s.pending}</div>
      <div class="stat-lbl">Pending</div>
    </div>
    <div class="stat-card">
      <div class="stat-icon" style="background:#f0fff4;"><i class="fas fa-shopping-bag" style="color:#3a9a5a;"></i></div>
      <div class="stat-val">${s.itemsSold}</div>
      <div class="stat-lbl">Items Sold</div>
    </div>
  `;
}

// ===== REVENUE CHART =====
function setPeriod(p, btn) {
  currentPeriod = p;
  document.querySelectorAll('.period-toggle .period-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderRevenueChart();
}

function renderRevenueChart() {
  const orders = getOrders().filter(o => o.status !== 'cancelled');
  const days = currentPeriod === 'week' ? 7 : 30;
  const labels = [], revenues = [], counts = [];

  for(let i = days-1; i >= 0; i--) {
    const d = new Date();
    d.setDate(d.getDate() - i);
    const key = d.toISOString().split('T')[0];
    const label = d.toLocaleDateString('id-ID', {day:'numeric', month:'short'});
    labels.push(label);

    const dayOrders = orders.filter(o => o.date && o.date.startsWith(key));
    revenues.push(dayOrders.reduce((s,o) => s+o.total, 0));
    counts.push(dayOrders.length);
  }

  if(revenueChartInst) revenueChartInst.destroy();
  const ctx = document.getElementById('revenueChart').getContext('2d');
  revenueChartInst = new Chart(ctx, {
    data: {
      labels,
      datasets: [
        {
          type: 'bar',
          label: 'Revenue',
          data: revenues,
          backgroundColor: 'rgba(249,198,204,0.7)',
          borderColor: '#e8a0aa',
          borderWidth: 2,
          borderRadius: 8,
          yAxisID: 'y',
        },
        {
          type: 'line',
          label: 'Order Count',
          data: counts,
          borderColor: '#C9BFEA',
          backgroundColor: 'rgba(201,191,234,0.15)',
          tension: 0.4,
          fill: true,
          pointBackgroundColor: '#C9BFEA',
          pointRadius: 4,
          yAxisID: 'y1',
        }
      ]
    },
    options: {
      responsive: true,
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: { display: true, position: 'top' },
        tooltip: {
          callbacks: {
            label: ctx => ctx.datasetIndex===0
              ? ' Revenue: ' + rp(ctx.parsed.y)
              : ' Orders: ' + ctx.parsed.y
          }
        }
      },
      scales: {
        y: {
          beginAtZero: true,
          ticks: { callback: v => 'Rp'+new Intl.NumberFormat('id').format(v) },
          grid: { color: '#f5f5f5' }
        },
        y1: {
          position: 'right',
          beginAtZero: true,
          ticks: { stepSize: 1 },
          grid: { display: false }
        }
      }
    }
  });
}

// ===== TOP PRODUCTS =====
function renderTopProducts() {
  const orders = getOrders().filter(o => o.status !== 'cancelled');
  const tally = {};
  orders.forEach(o => {
    o.items.forEach(i => {
      if(!tally[i.id]) tally[i.id] = { id:i.id, name:i.name, series:i.series||'', sold:0, revenue:0, img:i.img };
      tally[i.id].sold += i.qty;
      tally[i.id].revenue += i.price * i.qty;
    });
  });
  const top = Object.values(tally).sort((a,b) => b.sold-a.sold).slice(0,5);
  const container = document.getElementById('topProducts');

  if(!top.length) {
    container.innerHTML = '<div class="empty-dash"><div class="ei"><i class="fas fa-inbox" style="font-size:40px;color:#ddd;"></i></div><p>No sales yet</p></div>';
    return;
  }

  container.innerHTML = top.map((p,i) => `
    <div class="top-prod-item">
      <div class="top-prod-rank ${i===0?'rank-1':i===1?'rank-2':i===2?'rank-3':'rank-other'}">${i+1}</div>
      <img class="top-prod-img" src="${p.img}" onerror="this.src='assets/img/logo.png'" alt="${p.name}">
      <div class="top-prod-info">
        <div class="top-prod-name">${p.name}</div>
        <div class="top-prod-series">${rp(p.revenue)}</div>
      </div>
      <div class="top-prod-sold">${p.sold}x</div>
    </div>`).join('');
}

// ===== PAYMENT PIE =====
function renderPayChart() {
  const orders = getOrders();
  const methods = {};
  orders.forEach(o => { methods[o.payment] = (methods[o.payment]||0) + 1; });
  const labels = Object.keys(methods);
  const data = Object.values(methods);

  if(payChartInst) payChartInst.destroy();
  if(!labels.length) {
    document.getElementById('payChart').parentElement.innerHTML += '<div class="empty-dash"><div class="ei"><i class="fas fa-inbox" style="font-size:40px;color:#ddd;"></i></div><p>No data</p></div>';
    return;
  }
  const ctx = document.getElementById('payChart').getContext('2d');
  payChartInst = new Chart(ctx, {
    type: 'doughnut',
    data: { labels, datasets: [{ data, backgroundColor: ['#F9C6CC','#B8DCF5','#C1E0C8','#C9BFEA','#FAF0A0'], borderWidth: 0 }] },
    options: { plugins: { legend: { position: 'bottom', labels: { font: { family: 'Nunito', weight: '700' } } } }, cutout: '65%' }
  });
}

// ===== STATUS PIE =====
function renderStatusChart() {
  const orders = getOrders();
  const statuses = { pending:0, paid:0, shipped:0, done:0, cancelled:0 };
  orders.forEach(o => { if(statuses[o.status]!==undefined) statuses[o.status]++; });
  const labels = Object.keys(statuses).filter(k => statuses[k]>0);
  const data = labels.map(k => statuses[k]);
  const colors = { pending:'#FAF0A0', paid:'#C1E0C8', shipped:'#B8DCF5', done:'#d4edda', cancelled:'#f8d7da' };

  if(statusChartInst) statusChartInst.destroy();
  if(!labels.length) return;
  const ctx = document.getElementById('statusChart').getContext('2d');
  statusChartInst = new Chart(ctx, {
    type: 'doughnut',
    data: { labels, datasets: [{ data, backgroundColor: labels.map(l=>colors[l]), borderWidth: 0 }] },
    options: { plugins: { legend: { position: 'bottom', labels: { font: { family: 'Nunito', weight: '700' } } } }, cutout: '65%' }
  });
}

// ===== CITY LIST =====
function renderCityList() {
  const orders = getOrders();
  const cities = {};
  orders.forEach(o => { if(o.city) cities[o.city] = (cities[o.city]||0) + 1; });
  const sorted = Object.entries(cities).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const max = sorted[0]?.[1] || 1;

  document.getElementById('cityList').innerHTML = sorted.length ? sorted.map(([city,n]) => `
    <div style="margin-bottom:12px;">
      <div style="display:flex;justify-content:space-between;margin-bottom:4px;">
        <span style="font-weight:700;font-size:13px;">${city}</span>
        <span style="font-weight:900;font-size:13px;color:#c0536a;">${n} order</span>
      </div>
      <div style="background:#f0f0f0;border-radius:10px;height:8px;overflow:hidden;">
        <div style="background:linear-gradient(90deg,#F9C6CC,#c0536a);height:100%;border-radius:10px;width:${Math.round(n/max*100)}%;transition:width .5s;"></div>
      </div>
    </div>`).join('') :
    '<div class="empty-dash"><div class="ei"><i class="fas fa-inbox" style="font-size:40px;color:#ddd;"></i></div><p>No data</p></div>';
}

// ===== ORDERS TABLE =====
let currentFilter = 'all';
function filterOrders(f, btn) {
  currentFilter = f;
  document.querySelectorAll('#orderFilterBtns .period-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderOrdersTable(f);
}

function renderOrdersTable(filter) {
  let orders = getOrders();
  if(filter !== 'all') orders = orders.filter(o => o.status === filter);
  orders = [...orders].reverse(); // newest first

  document.getElementById('ordersBody').innerHTML = orders.length ? orders.map(o => `
    <tr>
      <td><strong>${o.code}</strong></td>
      <td>
        <div style="font-weight:800;">${o.name}</div>
        <div style="font-size:11px;color:#aaa;">${o.phone||''}</div>
      </td>
      <td>${o.city||'-'}</td>
      <td>${rp(o.subtotal||0)}</td>
      <td style="color:#3a9a5a;">${o.discount>0?'− '+rp(o.discount):'-'}</td>
      <td>${rp(o.shipping?.price||0)}</td>
      <td style="font-weight:900;color:#c0536a;">${rp(o.total)}</td>
      <td>${o.payment||'-'}</td>
      <td>
        <select class="status-sel" onchange="updateStatus('${o.code}',this.value)">
          ${['pending','paid','shipped','done','cancelled'].map(s =>
            `<option value="${s}" ${o.status===s?'selected':''}>${s.charAt(0).toUpperCase()+s.slice(1)}</option>`
          ).join('')}
        </select>
      </td>
      <td style="color:#aaa;font-size:12px;">${o.date ? new Date(o.date).toLocaleDateString('en-US',{day:'numeric',month:'short',year:'numeric'}) : '-'}</td>
    </tr>`).join('') :
    `<tr><td colspan="10" style="text-align:center;padding:32px;color:#bbb;">No orders${filter!=='all'?' with this status':''}</td></tr>`;
}

async function updateStatus(code, newStatus) {
  const ok = await updateStatusAPI(code, newStatus);
  if(ok) {
    await fetchOrders();
    renderStats();
    renderRevenueChart();
    renderTopProducts();
    renderPayChart();
    renderStatusChart();
    renderCityList();
    if(document.getElementById('sec-orders').style.display !== 'none') {
      renderOrdersTable(currentFilter);
    }
  }
}

// ===== PRODUCTS TABLE =====
function renderProductsTable() {
  document.getElementById('productsBody').innerHTML = PRODUCTS.map(p => `
    <tr>
      <td><img src="${p.img}" style="width:46px;height:46px;object-fit:cover;border-radius:10px;" onerror="this.src='assets/img/logo.png'"></td>
      <td><strong>${p.name}</strong></td>
      <td style="color:#aaa;font-size:12px;">${p.series}</td>
      <td style="font-weight:800;">${p.price ? rp(p.price) : '-'}</td>
      <td>
        <span style="font-weight:800;color:${p.stock<10?'#c0536a':'#1a6a3a'};">
          ${p.status==='gallery' ? '—' : p.stock+' pcs'}
        </span>
      </td>
      <td>
        <span class="s-badge ${p.status==='new'?'s-paid':'s-shipped'}">
         ${p.status==='new'?'<i class="fas fa-star"></i> New':'<i class="fas fa-image"></i> Gallery'}
        </span>
      </td>
    </tr>`).join('');
}

// ===== SEED DEMO =====
function seedDemoOrders() {
  const names = ['Ade Miraa','Siti Rahma','Budi Santoso','Putri Amelia','Reza Firmansyah','Nadia Kusuma'];
  const cities = ['Jakarta','Tanjung Pinang','Batam','Surabaya','Bandung','Medan'];
  const payments = ['DANA','Transfer Bank','COD'];
  const statuses = ['pending','paid','shipped','done'];
  const newProds = PRODUCTS.filter(p => p.status==='new');

  const demoOrders = [];
  for(let i = 0; i < 12; i++) {
    const itemCount = Math.ceil(Math.random()*3);
    const items = [];
    for(let j = 0; j < itemCount; j++) {
      const p = newProds[Math.floor(Math.random()*newProds.length)];
      const qty = Math.ceil(Math.random()*2);
      items.push({ id:p.id, name:p.name, series:p.series, price:p.price, img:p.img, qty });
    }
    const subtotal = items.reduce((s,i) => s+i.price*i.qty, 0);
    const shippingPrice = [14000,15000,17000,18000,25000][Math.floor(Math.random()*5)];
    const discount = Math.random()>0.7 ? Math.round(subtotal*0.1/1000)*1000 : 0;
    const total = subtotal - discount + shippingPrice;

    // spread over last 14 days
    const d = new Date();
    d.setDate(d.getDate() - Math.floor(Math.random()*14));
    d.setHours(Math.floor(Math.random()*12)+8);

    demoOrders.push({
      code: 'YKI-'+Math.random().toString(36).substring(2,10).toUpperCase(),
      date: d.toISOString(),
      name: names[Math.floor(Math.random()*names.length)],
      phone: '0812'+Math.floor(Math.random()*90000000+10000000),
      email: '', address: 'Jl. Demo No. '+Math.ceil(Math.random()*100),
      city: cities[Math.floor(Math.random()*cities.length)],
      shipping: { name:'JNE REG', price: shippingPrice },
      discount, discCode: discount?'YOOKI10':'',
      subtotal, total,
      payment: payments[Math.floor(Math.random()*payments.length)],
      items,
      status: statuses[Math.floor(Math.random()*statuses.length)]
    });
  }

  // Save demo orders to localStorage as fallback (no PHP needed for seed)
  const existing = JSON.parse(localStorage.getItem('yooki_orders')||'[]');
  localStorage.setItem('yooki_orders', JSON.stringify([...existing, ...demoOrders]));
  
  // Also try to save via API
  const saves = demoOrders.map(o =>
    fetch('api/save-order.php', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        name: o.name, phone: o.phone, email: o.email,
        address: o.address, city: o.city,
        shipping_name: o.shipping.name, shipping_cost: o.shipping.price,
        subtotal: o.subtotal, discount_code: o.discCode,
        discount_amount: o.discount, total: o.total,
        payment: o.payment, items: o.items
      })
    }).catch(()=>{})
  );
  
  Promise.all(saves).then(()=>{
    initDashboard();
    renderOrdersTable(currentFilter);
    alert('✅ 12 demo orders added!');
  });
}

// ===== INIT DASHBOARD =====
async function initDashboard() {
  await fetchOrders();
  renderStats();
  renderRevenueChart();
  renderTopProducts();
  renderPayChart();
  renderStatusChart();
  renderCityList();
}

initDashboard();
</script>
